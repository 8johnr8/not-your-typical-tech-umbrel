version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nytt-bookorbit_app_1
      APP_PORT: 3000
      # BookOrbit has its own accounts, and Kobo, KOReader and OPDS readers must reach it
      # without an Umbrel login.
      PROXY_AUTH_ADD: "false"

  # Makes sure the default Books folder exists and is writable by BookOrbit (UID 1000).
  permissions:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    user: "0:0"
    restart: "no"
    command: chown 1000:1000 /books
    volumes:
      - ${UMBREL_ROOT}/home/Books:/books

  app:
    image: ghcr.io/bookorbit/bookorbit:3.7.0@sha256:0d5f4a31576a2bcd96afa77b8eac75c3b8df395f0f9b9215995de59236f22b95
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-UTC}
      PUID: 1000
      PGID: 1000
      POSTGRES_HOST: nytt-bookorbit_db_1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: bookorbit
      JWT_SECRET: ${APP_NYTT_BOOKORBIT_JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${APP_NYTT_BOOKORBIT_PODCAST_ENCRYPTION_KEY}
      EMAIL_ENCRYPTION_KEY: ${APP_NYTT_BOOKORBIT_EMAIL_ENCRYPTION_KEY}
      MIGRATION_ENCRYPTION_KEY: ${APP_NYTT_BOOKORBIT_MIGRATION_ENCRYPTION_KEY}
      BOOK_REQUEST_ENCRYPTION_KEY: ${APP_NYTT_BOOKORBIT_BOOK_REQUEST_ENCRYPTION_KEY}
      # Shown by Umbrel as this app's password; BookOrbit asks for it once to create the admin.
      SETUP_BOOTSTRAP_TOKEN: ${APP_PASSWORD}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8909
      LIBRARY_BROWSE_ROOT: /books
      NODE_MAX_OLD_SPACE_SIZE: auto
    volumes:
      - ${UMBREL_ROOT}/home/Books:/books
      - ${APP_DATA_DIR}/data/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookorbit -d bookorbit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
