version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nytt-mastodon_proxy_1
      APP_PORT: 8080
      # Mastodon has its own accounts, and the fediverse and mobile apps must reach it
      # without an Umbrel login.
      PROXY_AUTH_ADD: "false"

  proxy:
    image: nginx:1.30-alpine@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/umbrel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - streaming

  # Mastodon's containers run as UID 991, while Umbrel creates app folders as UID 1000.
  permissions:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    user: "0:0"
    restart: "no"
    command: chown -R 991:991 /system /config
    volumes:
      - ${APP_DATA_DIR}/data/system:/system
      - ${APP_DATA_DIR}/data/config:/config

  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: on-failure
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: mastodon_production
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mastodon", "-d", "mastodon_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prepares/migrates the database and creates the owner account, then exits.
  setup:
    image: ghcr.io/mastodon/mastodon:v4.7.3@sha256:0bf26ebfb7d694bddd2fcf0c5769642ac29d997eb42169c540963cf0f27ee6ca
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh /umbrel-scripts/setup.sh
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
      OWNER_USERNAME: owner
      OWNER_EMAIL: owner@${DEVICE_DOMAIN_NAME}
      OWNER_PASSWORD: ${APP_PASSWORD}
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/mastodon/mastodon:v4.7.3@sha256:0bf26ebfb7d694bddd2fcf0c5769642ac29d997eb42169c540963cf0f27ee6ca
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh -c '. /umbrel-scripts/env.sh && exec bundle exec puma -C config/puma.rb'
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.3@sha256:a239a39b79b2b78903378b02fa947abeff78146f6b8c9c27f856e5269425653b
    restart: on-failure
    command: node ./streaming/index.js
    environment:
      NODE_ENV: production
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
    depends_on:
      setup:
        condition: service_completed_successfully

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.3@sha256:0bf26ebfb7d694bddd2fcf0c5769642ac29d997eb42169c540963cf0f27ee6ca
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh -c '. /umbrel-scripts/env.sh && exec bundle exec sidekiq'
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
    depends_on:
      setup:
        condition: service_completed_successfully
