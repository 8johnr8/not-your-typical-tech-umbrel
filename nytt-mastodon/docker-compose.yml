version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nytt-mastodon_proxy_1
      APP_PORT: 8080
      # Mastodon has its own accounts, and the fediverse and mobile apps must reach it
      # without an Umbrel login.
      PROXY_AUTH_ADD: "false"

  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/umbrel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - streaming

  # Mastodon's containers run as UID 991, while Umbrel creates app folders as UID 1000.
  permissions:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    user: "0:0"
    restart: "no"
    command: chown -R 991:991 /system /config
    volumes:
      - ${APP_DATA_DIR}/data/system:/system
      - ${APP_DATA_DIR}/data/config:/config

  db:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: on-failure
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: mastodon_production
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mastodon", "-d", "mastodon_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prepares/migrates the database and creates the owner account, then exits.
  setup:
    image: ghcr.io/mastodon/mastodon:v4.7.2@sha256:48214e836a1c6d1c12ee90cba1fee70082b497a34853e1bb124fcfe7d24290fd
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh /umbrel-scripts/setup.sh
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
      OWNER_USERNAME: owner
      OWNER_EMAIL: owner@${DEVICE_DOMAIN_NAME}
      OWNER_PASSWORD: ${APP_PASSWORD}
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/mastodon/mastodon:v4.7.2@sha256:48214e836a1c6d1c12ee90cba1fee70082b497a34853e1bb124fcfe7d24290fd
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh -c '. /umbrel-scripts/env.sh && exec bundle exec puma -C config/puma.rb'
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.2@sha256:e5d3336fc4bafac98d71105836a69a77b7e98611e2b95417b116860cce395017
    restart: on-failure
    command: node ./streaming/index.js
    environment:
      NODE_ENV: production
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
    depends_on:
      setup:
        condition: service_completed_successfully

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.2@sha256:48214e836a1c6d1c12ee90cba1fee70082b497a34853e1bb124fcfe7d24290fd
    volumes:
      - ${APP_DATA_DIR}/data/system:/opt/mastodon/public/system
      - ${APP_DATA_DIR}/data/config:/umbrel-config
      - ${APP_DATA_DIR}/umbrel:/umbrel-scripts:ro
    restart: on-failure
    command: sh -c '. /umbrel-scripts/env.sh && exec bundle exec sidekiq'
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DEVICE_DOMAIN_NAME}:8908
      DB_HOST: nytt-mastodon_db_1
      DB_PORT: 5432
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: ${APP_SEED}
      REDIS_HOST: nytt-mastodon_redis_1
      REDIS_PORT: 6379
      APP_SEED: ${APP_SEED}
      SMTP_SERVER: ""
      SMTP_PORT: 587
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: notifications@${DEVICE_DOMAIN_NAME}
    depends_on:
      setup:
        condition: service_completed_successfully
