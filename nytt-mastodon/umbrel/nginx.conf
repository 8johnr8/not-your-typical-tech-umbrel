# Routes the streaming API to its own container and everything else to the web container.

# Mastodon only works over HTTPS. umbrelOS reports the real scheme for LAN access, but
# tunnels (Cloudflare, Tailscale Funnel, ...) that forward to the plain HTTP port would
# otherwise end up in a redirect loop, so public hostnames are always treated as HTTPS.
map $host $mastodon_forwarded_proto {
  default                   https;
  ~\.local$                 $http_x_forwarded_proto;
  ~^[0-9.]+$                $http_x_forwarded_proto;
  ~^\[                      $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 100m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $mastodon_forwarded_proto;
  proxy_set_header Proxy "";

  location ^~ /api/v1/streaming {
    proxy_pass http://nytt-mastodon_streaming_1:4000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1d;
  }

  location / {
    proxy_pass http://nytt-mastodon_web_1:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
}
